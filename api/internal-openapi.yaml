openapi: 3.1.0
info:
  title: capstone-kv internal API
  version: "1.0"
  description: >-
    Endpoints between the coordinator and the shards (ADR-0010, ADR-0013). Not part of the
    public contract (api/openapi.yaml): clients never call them, they can change with any
    release, and the shards' security group lets only the coordinator reach a shard
    (ADR-0014). Shard registration has no authentication in M2: the coordinator's port is
    reachable only from inside the VPC and the allowed client range. A separate admin port
    and a persisted ring are M5's design (AI review §1.1).

    Replicas also serve GET /health, /health/live, /health/ready and /version, with the
    bodies documented in api/openapi.yaml (M5, spec health-endpoints).

    Planned leader transfer (M5, ADR-0036; internal/shard/transfer.go), coordinator to
    replica: POST /internal/v1/stepdown?epoch=&target=&wait_ms= (200 {lsn} once the target
    has acknowledged the leader's last record and it committed; 409 if not in time, and the
    leader keeps leading), POST /internal/v1/resume?epoch= (204), POST /internal/v1/epoch
    with {epoch, leader, leaderAddress} (200 {epoch}). Heartbeat answers carry
    "transferring": true while a transfer of the set runs.

servers:
  - url: http://localhost:8080
    description: coordinator (membership endpoints) or a shard replica (key-value and log endpoints)

paths:
  # --- On the coordinator: replica sets ------------------------------------------------
  /internal/v1/replicas:
    post:
      summary: A replica's heartbeat
      description: >-
        Every replica calls this at start and then every 5 seconds with its last durable
        record (ADR-0020). An unknown shard joins the ring. A set without a leader gets one
        once all its replicas have reported, or a majority has for 15 s: the one with the
        newest last record (on a tie, the configured first leader).
        The answer is the set's epoch and leader; a replica takes its role from it. A
        replica silent for 15 seconds is unavailable; a silent leader is replaced
        automatically once both followers answer.
      operationId: replicaHeartbeat
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Heartbeat" }
      responses:
        "200":
          description: Recorded; the set's current epoch and leader (epoch 0 while it has none)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500":
          description: The leader assignment couldn't be saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /internal/v1/shards:
    get:
      summary: List the replica sets on the ring
      operationId: listShards
      tags: [coordinator]
      responses:
        "200":
          description: Every shard the coordinator knows, sorted by ID, with its replicas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShardStatus" }

  /internal/v1/shards/{id}:
    delete:
      summary: Forget a pending or retired replica set
      description: >-
        M5 (ADR-0033): only a set that holds no keys anyone reads can be forgotten: a
        pending one (registered, never on the ring) or a retired one (its keys moved away by
        a removal migration). A set on the ring answers 409: it leaves through a migration,
        which moves its keys first; a base set never leaves. Not permanent: if its replicas
        are still running, their next heartbeat registers it again as pending, so stop them
        first. (Before M5 this dropped any set from the ring without moving its data.)
      operationId: removeShard
      tags: [coordinator]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The set is on the ring or is a base set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- On a shard: key-value storage ----------------------------------------------------
  /internal/v1/kv/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: >-
          The storage key, base64url without padding. Decoded, it is table, partition key
          and sort key joined by zero bytes (the sort key is empty for tables without one).
          The shard treats it as opaque bytes.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    put:
      summary: Store a value (create or replace) — on the leader only
      description: >-
        The leader appends the record to its log and flushes it, then waits until W
        replicas have it on disk (itself and, with W = 2, one follower) before answering
        and before the value becomes readable (ADR-0021, ADR-0023).
      operationId: shardPut
      tags: [shard]
      requestBody:
        required: true
        description: The item's JSON as the coordinator received it, stored as bytes (at most 1 MiB)
        content:
          application/json:
            schema: { type: object }
      parameters:
        - { name: X-Request-ID, in: header, required: false, schema: { type: string }, description: The coordinator's request ID, logged with the LSN }
        - { name: X-KV-Timestamp, in: header, required: false, schema: { type: string }, description: "A stamp the store returned earlier (retry): last-write-wins against the key's latest record (ADR-0028)" }
        - { name: If-Match, in: header, required: false, schema: { type: string }, description: Apply only if the key's latest stamp is this }
        - { name: If-None-Match, in: header, required: false, schema: { type: string, enum: ["*"] }, description: Apply only if the key has no live latest record }
      responses:
        "200":
          description: >-
            Committed (on W replicas' disks), or, with X-KV-Superseded, not stored because
            the key's latest record has a higher stamp and has committed
          headers:
            X-KV-Timestamp: { $ref: "#/components/headers/Stamp" }
            X-KV-Superseded: { description: "true when the write lost (last-write-wins)", schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/NotLeader" }
        "412": { description: "If-Match or If-None-Match doesn't hold", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { $ref: "#/components/responses/NotCommitted" }
        "413":
          description: Value larger than 1 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/WriteFailed" }
    get:
      summary: Read a value, with its version
      description: Any replica answers reads; the coordinator compares versions (ADR-0021).
      operationId: shardGet
      tags: [shard]
      responses:
        "200":
          description: The stored value, byte for byte
          headers:
            X-KV-Epoch: { $ref: "#/components/headers/VersionEpoch" }
            X-KV-LSN: { $ref: "#/components/headers/VersionLSN" }
            X-KV-Timestamp: { $ref: "#/components/headers/Stamp" }
            ETag: { description: The stamp in quotes, schema: { type: string } }
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: >-
            No such key (no body). With version headers it's a tombstone: deleted at that
            version; without them the key was never written here.
          headers:
            X-KV-Epoch: { $ref: "#/components/headers/VersionEpoch" }
            X-KV-LSN: { $ref: "#/components/headers/VersionLSN" }
    head:
      summary: Check that a key exists
      operationId: shardExists
      tags: [shard]
      responses:
        "200": { description: Exists }
        "400": { description: Key is not base64url }
        "404": { description: No such key }
    delete:
      summary: Delete a key — on the leader only (leaves a tombstone)
      operationId: shardDelete
      tags: [shard]
      responses:
        "204": { description: Deleted, committed like a put }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: No such key (nothing written) }
        "409": { $ref: "#/components/responses/NotLeader" }
        "412": { description: "If-Match doesn't hold", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { $ref: "#/components/responses/NotCommitted" }
        "500": { $ref: "#/components/responses/WriteFailed" }

  /internal/v1/log:
    get:
      summary: Pull the leader's log (followers call this)
      description: >-
        The follower sends the epoch, LSN and hash of its last durable record (ADR-0023).
        If that record isn't in the leader's log, the answer is empty with X-KV-Truncate-To:
        cut back to that LSN and ask again. Otherwise the LSN counts as the follower's ack,
        and the answer is up to `max` records after it, raw as in the log (ADR-0022); if
        there are none, the leader holds the request up to 5 s and then answers empty.
      operationId: shardLog
      tags: [shard]
      parameters:
        - { name: replica, in: query, required: true, schema: { type: string }, description: the follower's replica ID }
        - { name: epoch, in: query, required: true, schema: { type: integer, minimum: 0 }, description: epoch of its last record }
        - { name: lsn, in: query, required: true, schema: { type: integer, minimum: 0 }, description: LSN of its last record (its ack) }
        - { name: hash, in: query, required: true, schema: { type: string, pattern: "^[0-9a-f]{1,16}$" }, description: xxhash64 of its last record, hex }
        - { name: max, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Records (possibly none), or an instruction to cut back
          headers:
            X-KV-Epoch: { description: the leader's epoch, schema: { type: integer } }
            X-KV-Last: { description: the leader's last LSN, schema: { type: integer } }
            X-KV-Truncate-To: { description: "present only when the follower must cut its log back to this LSN", schema: { type: integer } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/NotLeader" }

components:
  schemas:
    Version:
      type: object
      required: [epoch, lsn]
      properties:
        epoch: { type: integer, minimum: 0 }
        lsn: { type: integer, minimum: 0 }
    Heartbeat:
      type: object
      required: [shard, replica, address]
      properties:
        shard: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$", description: "replica set, e.g. shard-1" }
        replica: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$", description: "stable replica ID, e.g. 1a" }
        address: { type: string, description: "base URL the coordinator and other replicas call, e.g. http://10.20.64.12:8081" }
        epoch: { type: integer, minimum: 0, description: newest epoch this replica has heard of }
        last: { $ref: "#/components/schemas/Version" }
    HeartbeatAnswer:
      type: object
      required: [epoch, leader, leaderAddress]
      properties:
        epoch: { type: integer, minimum: 0 }
        leader: { type: string }
        leaderAddress: { type: string, description: empty until the leader has reported }
    ShardStatus:
      type: object
      required: [id, state, base, epoch, leader, replicas, unavailable503, notCommitted504]
      properties:
        id: { type: string }
        state:
          type: string
          enum: [pending, active, leaving, retired]
          description: M5 (ADR-0033). Only active and leaving sets are on the ring
        base: { type: boolean, description: "One of the first expected sets: can't be removed" }
        epoch: { type: integer }
        leader: { type: string }
        unavailable503: { type: integer, description: item requests for this shard answered 503 }
        notCommitted504: { type: integer, description: writes for this shard answered 504 }
        replicas:
          type: array
          items:
            type: object
            required: [id, address, available, silentFor, last]
            properties:
              id: { type: string }
              address: { type: string }
              available: { type: boolean, description: false after 15 s without a heartbeat }
              silentFor: { type: string, description: time since the last heartbeat, e.g. "3s" }
              last: { $ref: "#/components/schemas/Version" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  headers:
    Stamp:
      description: The record's hybrid logical clock stamp (ADR-0028); also on a 504
      schema: { type: string }
    VersionEpoch: { description: "the key's version: epoch", schema: { type: integer } }
    VersionLSN: { description: "the key's version: LSN", schema: { type: integer } }
  responses:
    NotLeader:
      description: This replica isn't the leader of the current epoch
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotCommitted:
      description: >-
        No follower had the write within the commit timeout (2 s). It is in the leader's
        log and may still become visible: outcome unknown (ADR-0021).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Malformed request (bad JSON, bad ID or address, key not base64url)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such shard
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WriteFailed:
      description: >-
        The log write failed. The log was cut back to the last good record, or, if that
        failed too, the shard refuses all writes until restarted (ADR-0018).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
