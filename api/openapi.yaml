openapi: 3.1.0
info:
  title: capstone-kv
  version: "1.0"
  description: >-
    Public API of the capstone-kv coordinator (ADR-0010). Register a table, then put,
    read, check and delete its items. Internal shard endpoints (/internal/v1/...) are
    not part of this contract.

    Every request except /health needs an API key, `Authorization: Bearer <key>`, whose
    scopes allow it: read (GET, HEAD, table lists), write (PUT on items), delete (DELETE
    on items), admin (creating tables) (ADR-0027). Every answer carries `X-Request-ID`:
    the client's own, or one the coordinator made; it names the request in the logs.

    Versions (ADR-0028): every write is stamped by the shard's leader with a hybrid
    logical clock; the stamp comes back in `X-KV-Timestamp` (also on a 504) and as the
    `ETag`. A retry that sends the stamp back in `X-KV-Timestamp` loses to any newer
    write to the key (last-write-wins: 200 with `X-KV-Superseded: true`). `If-Match`
    and `If-None-Match: *` make a write conditional (412 when the condition fails).

servers:
  - url: http://localhost:8080

security:
  - ApiKey: []

paths:
  /health:
    get:
      summary: Whether the node can serve requests
      operationId: health
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: >-
            The coordinator can't serve yet: fewer shards have registered than it expects.
            Same body as 200, with status "unavailable" and ready false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/tables:
    post:
      summary: Register a table
      operationId: createTable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TableDefinition" }
      responses:
        "201":
          description: Table registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableDefinition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A table with this name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List tables
      operationId: listTables
      responses:
        "200":
          description: All registered tables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TableDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tables/{table}:
    parameters:
      - $ref: "#/components/parameters/Table"
    get:
      summary: Read a table definition
      operationId: getTable
      responses:
        "200":
          description: The table definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # Tables without a sort key: the item is addressed by its partition key alone.
  /v1/tables/{table}/items/{pk}:
    $ref: "#/components/pathItems/ItemByPartitionKey"

  # Tables with a sort key: the item is addressed by partition key + sort key.
  /v1/tables/{table}/items/{pk}/{sk}:
    $ref: "#/components/pathItems/ItemByFullKey"

components:
  parameters:
    Table:
      name: table
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    PartitionKey:
      name: pk
      in: path
      required: true
      description: Partition key value. Decides the shard (ADR-0012).
      schema: { type: string, minLength: 1, maxLength: 1024 }
    SortKey:
      name: sk
      in: path
      required: true
      description: Sort key value. Distinguishes items inside one partition; not hashed.
      schema: { type: string, minLength: 1, maxLength: 1024 }

    Stamp:
      name: X-KV-Timestamp
      in: header
      required: false
      description: >-
        A stamp the store returned for an earlier attempt of this write (a retry after
        504). The write then loses to any newer write to the key (last-write-wins). A
        stamp more than 5 s ahead of the leader's clock is refused with 400.
      schema: { type: string, pattern: "^[0-9]+$" }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Apply only if the item's current ETag is this one; 412 otherwise.
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: "`*`: create only; 412 if the item exists."
      schema: { type: string, enum: ["*"] }

  headers:
    Stamp:
      description: The record's hybrid logical clock stamp (ADR-0028)
      schema: { type: string, pattern: "^[0-9]+$" }
    ETag:
      description: The record's version, its stamp in quotes; send it back in If-Match
      schema: { type: string }
    Superseded:
      description: "`true` when the write lost to a newer write to the key and was not stored"
      schema: { type: string, enum: ["true"] }

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: An API key; its scopes decide what it may do (ADR-0027)

  pathItems:
    ItemByPartitionKey:
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/PartitionKey"
      put:
        summary: "CREATE — put an item (creates or replaces; If-None-Match: * creates only)"
        operationId: putItem
        parameters:
          - $ref: "#/components/parameters/Stamp"
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IfNoneMatch"
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        responses:
          "200": { $ref: "#/components/responses/Written" }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "412": { $ref: "#/components/responses/PreconditionFailed" }
          "503": { $ref: "#/components/responses/Unavailable" }
          "504": { $ref: "#/components/responses/NotCommitted" }
      get:
        summary: READ — get an item
        operationId: getItem
        responses:
          "200":
            description: The item, with its version
            headers:
              ETag: { $ref: "#/components/headers/ETag" }
              X-KV-Timestamp: { $ref: "#/components/headers/Stamp" }
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Item" }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "503": { $ref: "#/components/responses/Unavailable" }
      head:
        summary: EXISTS — check whether an item is present (no body)
        operationId: itemExists
        responses:
          "200": { description: Present }
          "400": { description: Wrong key shape for this table }
          "401": { description: No valid API key }
          "403": { description: The key lacks the read scope }
          "404": { description: Absent, or the table doesn't exist }
          "503": { description: The owning shard is unavailable }
      delete:
        summary: DELETE — remove an item
        operationId: deleteItem
        parameters:
          - $ref: "#/components/parameters/Stamp"
          - $ref: "#/components/parameters/IfMatch"
        responses:
          "204": { description: Deleted }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "412": { $ref: "#/components/responses/PreconditionFailed" }
          "503": { $ref: "#/components/responses/Unavailable" }
          "504": { $ref: "#/components/responses/NotCommitted" }
    ItemByFullKey:
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/PartitionKey"
        - $ref: "#/components/parameters/SortKey"
      put:
        summary: "CREATE — put an item (creates or replaces; If-None-Match: * creates only)"
        operationId: putItemWithSortKey
        parameters:
          - $ref: "#/components/parameters/Stamp"
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IfNoneMatch"
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        responses:
          "200": { $ref: "#/components/responses/Written" }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "412": { $ref: "#/components/responses/PreconditionFailed" }
          "503": { $ref: "#/components/responses/Unavailable" }
          "504": { $ref: "#/components/responses/NotCommitted" }
      get:
        summary: READ — get an item
        operationId: getItemWithSortKey
        responses:
          "200":
            description: The item, with its version
            headers:
              ETag: { $ref: "#/components/headers/ETag" }
              X-KV-Timestamp: { $ref: "#/components/headers/Stamp" }
            content:
              application/json:
                schema: { $ref: "#/components/schemas/Item" }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "503": { $ref: "#/components/responses/Unavailable" }
      head:
        summary: EXISTS — check whether an item is present (no body)
        operationId: itemExistsWithSortKey
        responses:
          "200": { description: Present }
          "400": { description: Wrong key shape for this table }
          "401": { description: No valid API key }
          "403": { description: The key lacks the read scope }
          "404": { description: Absent, or the table doesn't exist }
          "503": { description: The owning shard is unavailable }
      delete:
        summary: DELETE — remove an item
        operationId: deleteItemWithSortKey
        parameters:
          - $ref: "#/components/parameters/Stamp"
          - $ref: "#/components/parameters/IfMatch"
        responses:
          "204": { description: Deleted }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "412": { $ref: "#/components/responses/PreconditionFailed" }
          "503": { $ref: "#/components/responses/Unavailable" }
          "504": { $ref: "#/components/responses/NotCommitted" }

  responses:
    Written:
      description: >-
        Stored, or (with `X-KV-Superseded: true`) not stored because a newer write to the
        key won.
      headers:
        X-KV-Timestamp: { $ref: "#/components/headers/Stamp" }
        ETag: { $ref: "#/components/headers/ETag" }
        X-KV-Superseded: { $ref: "#/components/headers/Superseded" }
    NotCommitted:
      description: >-
        The write reached the shard's leader but no other replica confirmed it within 2 s.
        It may still take effect: the outcome is unknown, not failed (ADR-0021). To retry
        safely, send the returned `X-KV-Timestamp` back: the retry then loses to any newer
        write instead of overwriting it (ADR-0028).
      headers:
        X-KV-Timestamp: { $ref: "#/components/headers/Stamp" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No API key, or one the store doesn't know
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The API key lacks the scope this operation needs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: "`If-Match` or `If-None-Match` doesn't hold: the item changed, or exists"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid input, e.g. a missing sort key on a table that has one
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The table or the item doesn't exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: >-
        The shard that owns this key is unavailable, or the coordinator is still waiting
        for shards to register (ADR-0013). Retry later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Name:
      type: string
      pattern: "^[A-Za-z0-9_.-]{1,128}$"
    TableDefinition:
      type: object
      required: [name, partitionKey]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        partitionKey:
          description: Name of the partition key attribute
          $ref: "#/components/schemas/Name"
        sortKey:
          description: Name of the sort key attribute; omit for a partition-key-only table
          $ref: "#/components/schemas/Name"
      examples:
        - { name: users, partitionKey: userId }
        - { name: orders, partitionKey: customerId, sortKey: orderId }
    Item:
      description: The stored value, any JSON object
      type: object
      additionalProperties: true
      examples:
        - { name: Ira, city: Kyiv }
    Health:
      type: object
      required: [status, role, version]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        role: { type: string, enum: [coordinator, shard] }
        ready:
          type: boolean
          description: Coordinator only. True once the expected shards have registered and each has a leader
        shards:
          type: integer
          description: Coordinator only. Shards currently registered
        failures:
          type: object
          description: >-
            Coordinator only. Per shard, item requests answered 503 (no live leader or too
            few replicas) and writes answered 504 (not committed in time) since start
          additionalProperties:
            type: object
            properties:
              unavailable503: { type: integer }
              notCommitted504: { type: integer }
        keys:
          type: integer
          description: Shard only. Keys the shard holds
        version:
          type: string
          description: Commit SHA the running binary was built from ("dev" for local builds)
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
