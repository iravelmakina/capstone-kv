# Local cluster: the same image as on EC2. One coordinator and 2 shards × 3 replicas
# (ADR-0020), W = 2, R = 2 (ADR-0021).
#   make local-up    then   make smoke   and   KV_API_KEY=$(cat secrets/ops.key) scripts/failure-tests.sh
# The coordinator requires API keys (ADR-0027): `make local-up` makes them in secrets/.
# The coordinator is reachable on localhost:8080 as in AWS. Replica ports are published on
# 127.0.0.1 only, so the failure tests can read their /health; in AWS they stay private.

x-replica: &replica
  image: capstone-kv:local
  depends_on: [coordinator]
  restart: always

x-replica-env: &replica-env
  KV_ROLE: shard
  KV_W: "2"
  KV_COORDINATOR_URL: http://coordinator:8080

services:
  coordinator:
    build: .
    image: capstone-kv:local
    environment:
      KV_ROLE: coordinator
      KV_EXPECTED_SHARDS: "2"
      KV_REPLICAS: "3"
      KV_W: "2"
      KV_LEADERS: shard-1=1a,shard-2=2b   # first leaders on different nodes (ADR-0020)
      KV_API_KEYS_FILE: /keys/api-keys.json
    ports:
      - "8080:8080"
    volumes:
      - coordinator-data:/data
      - ./secrets/api-keys.json:/keys/api-keys.json:ro
    restart: always

  r1a:
    <<: *replica
    environment: { <<: *replica-env, KV_SHARD: shard-1, KV_REPLICA: 1a, KV_ADVERTISE_URL: "http://r1a:8080" }
    ports: ["127.0.0.1:8111:8080"]
    volumes: [r1a-data:/data]
  r1b:
    <<: *replica
    environment: { <<: *replica-env, KV_SHARD: shard-1, KV_REPLICA: 1b, KV_ADVERTISE_URL: "http://r1b:8080" }
    ports: ["127.0.0.1:8112:8080"]
    volumes: [r1b-data:/data]
  r1c:
    <<: *replica
    environment: { <<: *replica-env, KV_SHARD: shard-1, KV_REPLICA: 1c, KV_ADVERTISE_URL: "http://r1c:8080" }
    ports: ["127.0.0.1:8113:8080"]
    volumes: [r1c-data:/data]
  r2a:
    <<: *replica
    environment: { <<: *replica-env, KV_SHARD: shard-2, KV_REPLICA: 2a, KV_ADVERTISE_URL: "http://r2a:8080" }
    ports: ["127.0.0.1:8121:8080"]
    volumes: [r2a-data:/data]
  r2b:
    <<: *replica
    environment: { <<: *replica-env, KV_SHARD: shard-2, KV_REPLICA: 2b, KV_ADVERTISE_URL: "http://r2b:8080" }
    ports: ["127.0.0.1:8122:8080"]
    volumes: [r2b-data:/data]
  r2c:
    <<: *replica
    environment: { <<: *replica-env, KV_SHARD: shard-2, KV_REPLICA: 2c, KV_ADVERTISE_URL: "http://r2c:8080" }
    ports: ["127.0.0.1:8123:8080"]
    volumes: [r2c-data:/data]

  # --- Monitoring (M4, ADR-0029): the same configuration files as on the monitor instance.
  # Grafana http://localhost:3000, Prometheus :9090, Alertmanager :9093 (this machine only).
  prometheus:
    image: prom/prometheus:v3.1.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=24h]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - ./monitoring/targets-local:/etc/prometheus/targets:ro
    ports: ["127.0.0.1:9090:9090"]
    restart: always
  alertmanager:
    image: prom/alertmanager:v0.28.0
    entrypoint: [/bin/sh, /start.sh]
    volumes:
      - ./monitoring/alertmanager/start.sh:/start.sh:ro
      - ./secrets/telegram:/secrets:ro   # telegram_token and telegram_chat_id, if made
    ports: ["127.0.0.1:9093:9093"]
    restart: always
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./secrets/probe.key:/etc/blackbox/probe.key:ro
    restart: always
  loki:
    image: grafana/loki:3.3.2
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
    restart: always
  alloy:
    image: grafana/alloy:v1.5.1
    user: "0"                                # reads the Docker socket
    command: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
    environment:
      LOKI_URL: http://loki:3100
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local only: bound to 127.0.0.1
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/capstone-kv.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    restart: always

# Named volumes keep data across restarts and container re-creation. Fixed names, so
# `make rebuild-replica` can wipe one replica's volume.
volumes:
  coordinator-data: { name: kv-coordinator-data }
  r1a-data: { name: kv-r1a-data }
  r1b-data: { name: kv-r1b-data }
  r1c-data: { name: kv-r1c-data }
  r2a-data: { name: kv-r2a-data }
  r2b-data: { name: kv-r2b-data }
  r2c-data: { name: kv-r2c-data }
