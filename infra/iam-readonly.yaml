AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  capstone-kv M1: view-only policies per service, a separate deny policy for data and
  secrets, and a role another principal can assume with MFA. ADRs 0006-0008. NEVER DEPLOYED: the sandbox
  denies iam:CreatePolicy and iam:CreateRole (docs/m1/labrole-dissection.md).

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: One IAM user or role allowed to assume the role, e.g. an auditor.
    # A user or role ARN only. A whole account (arn:aws:iam::<id>:root) is rejected,
    # because it would let anyone that account allows assume the role (ADR-0006, option C).
    AllowedPattern: ^arn:aws:iam::\d{12}:(user|role)/[\w+=,.@/-]+$
    ConstraintDescription: must be an IAM user or role ARN, not an account root

Resources:
  # View policies, one per area (ADR-0008). Every action is named, no wildcards
  # (ADR-0007). Resource is "*" only for list/describe calls that accept nothing else
  # (no resource-level permissions); everything that accepts an ARN is limited to velmakina-*.
  ViewNetworkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-view-network
      Description: See the VPC and its network configuration.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeNetwork
            Effect: Allow
            Action:
              - ec2:DescribeVpcs
              - ec2:DescribeVpcAttribute          # DNS settings
              - ec2:DescribeSubnets
              - ec2:DescribeRouteTables
              - ec2:DescribeInternetGateways
              - ec2:DescribeNatGateways
              - ec2:DescribeVpcEndpoints
              - ec2:DescribePrefixLists
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSecurityGroupRules
              - ec2:DescribeNetworkAcls
              - ec2:DescribeAddresses
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInstanceConnectEndpoints
            Resource: "*"
  ViewComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-view-compute
      Description: See instances, volumes, load balancers and Auto Scaling. No user data.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeCompute
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeVolumes
              - ec2:DescribeLaunchTemplates       # names and versions, not their contents
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeScalingActivities
              - autoscaling:DescribePolicies
            Resource: "*"
  ViewStacksPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-view-stacks
      Description: See which stacks exist; details, events and drift of our stacks only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListStacksAndTags
            Effect: Allow
            Action:
              - cloudformation:ListStacks
              - cloudformation:ListExports
              - tag:GetResources                  # find everything tagged Project=capstone-kv
            Resource: "*"
          - Sid: ProjectStacks
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResourceDrifts
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/velmakina-*/*
  ViewMonitoringPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-view-monitoring
      Description: See alarms, metrics and log group names. No log contents.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeMonitoring
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricData
              - logs:DescribeLogGroups            # group names, not log contents
            Resource: "*"
  ViewS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-view-s3
      Description: See the bucket list and the settings of our buckets. No contents.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListBuckets
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: "*"
          - Sid: ProjectBucketSettings
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:GetBucketVersioning
              - s3:GetBucketTagging
              - s3:GetEncryptionConfiguration
              - s3:GetBucketPublicAccessBlock
            Resource: !Sub arn:${AWS::Partition}:s3:::velmakina-*
  ViewIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-view-iam
      Description: See role and policy names; documents of our roles and policies only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListIam
            Effect: Allow
            Action:
              - iam:ListRoles                     # names only
              - iam:ListPolicies
            Resource: "*"
          - Sid: ProjectRolesAndPolicies
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:GetPolicy
              - iam:GetPolicyVersion
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/velmakina-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/velmakina-*
  # Deny policy: explicit Deny on reading stored data and secrets. Kept separate so the
  # view policies can be reused without breaking a principal that legitimately reads data.
  # An explicit Deny wins over any Allow, now or attached later (ADR-0006).
  DenyDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: velmakina-deny-data
      Description: Never read stored data or secrets, whatever else is attached.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyDataAndSecrets
            Effect: Deny
            Action:
              - s3:GetObject*                  # object contents, versions, ACLs
              - s3:ListBucket                  # object keys are data in a key-value store
              - s3:ListBucketVersions
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:PartiQLSelect
              - dynamodb:GetRecords            # stream records
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - ssm:GetParameter*
              - kms:Decrypt
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:StartQuery
              - lambda:GetFunction*            # code location, environment variables
              - cloudformation:GetTemplate
              - ec2:DescribeInstanceAttribute  # user data often holds secrets
              - ec2:GetConsoleOutput
              - ec2:GetPasswordData
              - ec2:DescribeLaunchTemplateVersions        # returns the template's user data
              - autoscaling:DescribeLaunchConfigurations  # returns user data too
            Resource: "*"

  # The role: all view policies + the Deny; assumable only by the one trusted principal, with MFA.
  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: velmakina-readonly
      Description: View-only access for an auditor who signed in with MFA.
      MaxSessionDuration: 3600                 # 1 hour, the minimum AWS allows
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              Bool:                            # Bool, not BoolIfExists: a missing key must fail
                aws:MultiFactorAuthPresent: "true"
              NumericLessThanEquals:
                aws:MultiFactorAuthAge: 3600   # MFA used within the last hour
      ManagedPolicyArns:
        - !Ref ViewNetworkPolicy               # Ref on a managed policy returns its ARN
        - !Ref ViewComputePolicy
        - !Ref ViewStacksPolicy
        - !Ref ViewMonitoringPolicy
        - !Ref ViewS3Policy
        - !Ref ViewIamPolicy
        - !Ref DenyDataPolicy

Outputs:
  RoleArn:
    Value: !GetAtt ReadOnlyRole.Arn
