      - series: 'kv_request_duration_seconds_bucket{op="write",shard="shard-1",le="+Inf"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_replica_role{role="leader",shard="shard-1",replica="1a"}'
        values: "1x80"
      - series: 'kv_replica_request_duration_seconds_bucket{op="write",shard="shard-1",replica="1a",le="0.04"}'
        values: "0 2900 5800 8700 11600 14500 17400 20300 23200 26100 29000 31900 34800 37700 40600 43500 46400 49300 52200 55100 58000 60900 63800 66700 69600 72500 75400 78300 81200 84100 87000 89900 92800 95700 98600 101500 104400 107300 110200 113100 116000 118900 121800 124700 127600 130500 133400 136300 139200 142100 145000 147900 150800 153700 156600 159500 162400 165300 168200 171100 174000 176900 179800 182700 185600 188500 191400 194300 197200 200100 203000 205900 208800 211700 214600 217500 220400 223300 226200 229100 232000"
      - series: 'kv_replica_request_duration_seconds_bucket{op="write",shard="shard-1",replica="1a",le="0.05"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_replica_request_duration_seconds_bucket{op="write",shard="shard-1",replica="1a",le="+Inf"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_requests_total{op="write",code="200",shard="shard-1",principal="bench"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
    alert_rule_test:
      - eval_time: 3m
        alertname: ScaleOutDue
        exp_alerts: []
      - eval_time: 6m
        alertname: ScaleOutDue
        exp_alerts:
          - exp_labels: { severity: info, trigger: write, shard: shard-1, op: write }
            exp_annotations:
              summary: "Scale-out due: shard-1 write p99 above 50 ms"
              description: "The coordinator's write p99 for shard-1 is 60ms under load, and its leader is slow too (runbook: ScaleOutDue)."
      - eval_time: 6m
        alertname: CoordinatorBound
        exp_alerts: []

  # The same coordinator p99 while the leader answers within 40 ms: the time isn't spent in
  # the shard, so no scale-out; CoordinatorBound instead.
  - interval: 15s
    input_series:
      - series: 'kv_request_duration_seconds_bucket{op="write",shard="shard-1",le="0.04"}'
        values: "0 2900 5800 8700 11600 14500 17400 20300 23200 26100 29000 31900 34800 37700 40600 43500 46400 49300 52200 55100 58000 60900 63800 66700 69600 72500 75400 78300 81200 84100 87000 89900 92800 95700 98600 101500 104400 107300 110200 113100 116000 118900 121800 124700 127600 130500 133400 136300 139200 142100 145000 147900 150800 153700 156600 159500 162400 165300 168200 171100 174000 176900 179800 182700 185600 188500 191400 194300 197200 200100 203000 205900 208800 211700 214600 217500 220400 223300 226200 229100 232000"
