            exp_annotations:
              summary: "shard-1 is slow at the coordinator, not in the shard"
              description: "Write p99 above 50 ms at the coordinator while the leader answers within 40 ms: no scale-out (runbook: CoordinatorBound)."

  # Slow at 1 request/s: below the 100 requests/s floor, nothing fires.
  - interval: 15s
    input_series:
      - series: 'kv_request_duration_seconds_bucket{op="write",shard="shard-1",le="0.04"}'
        values: "0 14 5800 8700 11600 14500 17400 20300 23200 26100 140 31900 34800 37700 40600 43500 46400 49300 52200 55100 58000 60900 63800 66700 69600 72500 75400 78300 81200 84100 87000 89900 92800 95700 98600 101500 104400 107300 110200 113100 116000 118900 121800 124700 127600 130500 133400 136300 139200 142100 145000 147900 150800 153700 156600 159500 162400 165300 168200 171100 174000 176900 179800 182700 185600 188500 191400 194300 197200 200100 2015 205900 208800 211700 214600 217500 220400 223300 226200 229100 232000"
      - series: 'kv_request_duration_seconds_bucket{op="write",shard="shard-1",le="0.05"}'
        values: "0 14 5800 8700 11600 14500 17400 20300 23200 26100 140 31900 34800 37700 40600 43500 46400 49300 52200 55100 58000 60900 63800 66700 69600 72500 75400 78300 81200 84100 87000 89900 92800 95700 98600 101500 104400 107300 110200 113100 116000 118900 121800 124700 127600 130500 133400 136300 139200 142100 145000 147900 150800 153700 156600 159500 162400 165300 168200 171100 174000 176900 179800 182700 185600 188500 191400 194300 197200 200100 2015 205900 208800 211700 214600 217500 220400 223300 226200 229100 232000"
      - series: 'kv_request_duration_seconds_bucket{op="write",shard="shard-1",le="0.06"}'
