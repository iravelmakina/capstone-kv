      - series: 'kv_request_duration_seconds_bucket{op="write",shard="shard-1",le="+Inf"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_replica_role{role="leader",shard="shard-1",replica="1a"}'
        values: "1x80"
      - series: 'kv_replica_request_duration_seconds_bucket{op="write",shard="shard-1",replica="1a",le="0.04"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_replica_request_duration_seconds_bucket{op="write",shard="shard-1",replica="1a",le="0.05"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_replica_request_duration_seconds_bucket{op="write",shard="shard-1",replica="1a",le="+Inf"}'
        values: "0 3000 6000 9000 12000 15000 18000 21000 24000 27000 30000 33000 36000 39000 42000 45000 48000 51000 54000 57000 60000 63000 66000 69000 72000 75000 78000 81000 84000 87000 90000 93000 96000 99000 102000 105000 108000 111000 114000 117000 120000 123000 126000 129000 132000 135000 138000 141000 144000 147000 150000 153000 156000 159000 162000 165000 168000 171000 174000 177000 180000 183000 186000 189000 192000 195000 198000 201000 204000 207000 210000 213000 216000 219000 222000 225000 228000 231000 234000 237000 240000"
      - series: 'kv_requests_total{op="write",code="200",shard="shard-1",principal="bench"}'
