# capstone-kv docs check (ADR-0024): documentation commits skip ci-cd.yml (ADR-0019), so
# they get this light check instead. No AWS and no secrets, so it runs outside a lab session.
name: docs

# Runs when any of these paths changed: on a docs-only commit alone, on a mixed commit
# next to ci-cd.yml. Keep this list the same as ci-cd.yml's paths-ignore.
on:
  push:
    paths:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  pull_request:
    paths:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Every change and spec, strict, with the OpenSpec version the repo pins (CLAUDE.md).
      - name: OpenSpec validate
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx -y @fission-ai/openspec@1.16.0 validate --all --strict --no-interactive

      # Every [text](path) in a tracked Markdown file must point to a file that exists.
      # Code (`inline` and ``` blocks) is skipped first: a "](x)" there is an example, not a link.
      # Web links and mailto are skipped; "#anchor" parts are dropped; "/path" is from the repo root.
      - name: Relative links
        run: |
          broken=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target="${link%%#*}"
              case "$target" in ""|http://*|https://*|mailto:*) continue ;; esac
              case "$target" in /*) path=".$target" ;; *) path="$dir/$target" ;; esac
              if [ ! -e "$path" ]; then
                echo "::error file=$file::broken link: $link"
                broken=1
              fi
            done < <(awk '/^[[:space:]]*```/ { code = !code; next } !code { gsub(/`[^`]*`/, ""); print }' "$file" \
                     | grep -oE '\]\([^)[:space:]]+\)' | sed -E 's/^\]\((.*)\)$/\1/' || true)
          done < <(git ls-files -z '*.md')
          exit "$broken"
